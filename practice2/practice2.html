<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Pendaftaran Wisuda</title>
</head>
<body>
    <h2>Formulir Pendaftaran Wisuda</h2>
    <p>Silakan isi formulir di bawah ini untuk mendaftar wisuda:</p>

    <form action="#" method="post">
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda" required>
        <br><br>

        <label for="npm">NIM (Nomor Induk Mahasiswa):</label>
        <input type="text" id="npm" name="npm" placeholder="Masukkan NPM Anda" required>
        <br><br>

        <label for="jurusan">Jurusan:</label>
        <input type="text" id="jurusan" name="jurusan" placeholder="Masukkan jurusan Anda" required>
        <br><br>

        <label for="email">Alamat Email:</label>
        <input type="email" id="email" name="email" placeholder="Masukkan alamat email Anda" required>
        <br><br>

        <label for="no_hp">Nomor HP:</label>
        <input type="tel" id="no_hp" name="no_hp" placeholder="Masukkan nomor HP Anda" required>
        <br><br>

        <label for="alamat">Alamat:</label>
        <textarea id="alamat" name="alamat" rows="4" placeholder="Masukkan alamat Anda" required></textarea>
        <br><br>

        <label>Jenis Kelamin:</label>
        <input type="radio" id="pria" name="jenis_kelamin" value="Pria">
        <label for="pria">Pria</label>
        <input type="radio" id="wanita" name="jenis_kelamin" value="Wanita">
        <label for="wanita">Wanita</label>
        <br><br>

        <label for="tanggal_lahir">Tanggal Lahir:</label>
        <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
        <br><br>

        <label for="minat">Program Studi:</label>
        <select id="program_studi" name="program_studi">
            <option value="Teknik Informatika">Teknik Informatika</option>
            <option value="Teknik Industri">Manajemen Bisnis</option>
            <option value="Sistem Informasi">Ilmu Komunikasi</option>
            <option value="Teknik Telekomunikasi">Akuntansi</option>
        </select>
        <br><br>

        <label for="saran">Saran untuk Panitia Wisuda:</label>
        <textarea id="saran" name="saran" rows="4" placeholder="Tulis saran Anda di sini"></textarea>
        <br><br>

        <input type="submit" value="Daftar Wisuda">
    </form>
</body>
</html>
